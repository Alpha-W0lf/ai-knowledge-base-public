[project]
name = "ai-knowledge-base"
version = "0.1.0"
description = "Local hybrid search (vector + keyword, RRF, optional cross-encoder) for coding agents, served through a read-only MCP server"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.27.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ce = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
