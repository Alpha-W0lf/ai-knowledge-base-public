[project]
name = "ai-knowledge-base"
version = "0.1.0"
description = "Local-first vector knowledge base for AI domain research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.27.0",
    "ollama>=0.4.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "python-dateutil>=2.8.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
