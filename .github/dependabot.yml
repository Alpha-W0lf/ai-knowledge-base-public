version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Published, reviewed eval numbers stay fixed; lancedb 0.40's stemmer moves held-out rows and can't be pinned.
      - dependency-name: "lancedb"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
